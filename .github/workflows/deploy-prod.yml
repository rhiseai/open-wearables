# Production Deploy — main → ECR → ECS
#
# Triggered on every push to main. Build matrix produces:
#   - backend container image → ECR lucie/ow-backend
#   - frontend container image → ECR lucie/ow-frontend (TanStack Start + Nitro
#     Node server, NOT a static SPA)
# Both tagged :latest + :sha-<short>.
#
# Then runs alembic migrator, then rolls services in order:
#   migrate → (deploy-frontend ‖ deploy-svix → deploy-app)

name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eusc-de-east-1
  ECS_CLUSTER: lucie-prod
  BACKEND_REPO: lucie/ow-backend
  FRONTEND_REPO: lucie/ow-frontend
  ECR_REGISTRY: 326876515198.dkr.ecr.eusc-de-east-1.amazonaws.eu
  OW_API_BASE_URL: https://ow.getlucie.ai
  ROLE_ARN: arn:aws-eusc:iam::326876515198:role/ow-deploy-prod

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: ./backend
            repo: lucie/ow-backend
          - name: frontend
            context: ./frontend
            repo: lucie/ow-frontend
    outputs:
      sha_short: ${{ steps.tag.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: ow-build-${{ matrix.name }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.eu

      - name: Compute short SHA
        id: tag
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "${GITHUB_OUTPUT}"

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          build-args: |
            VITE_API_URL=${{ env.OW_API_BASE_URL }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.repo }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ matrix.repo }}:sha-${{ steps.tag.outputs.sha_short }}

  prepare-release:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    outputs:
      migrator_task_definition: ${{ steps.register.outputs.ow_migrator }}
      backend_task_definition: ${{ steps.register.outputs.ow_backend }}
      worker_task_definition: ${{ steps.register.outputs.ow_celery_worker }}
      beat_task_definition: ${{ steps.register.outputs.ow_celery_beat }}
      frontend_task_definition: ${{ steps.register.outputs.ow_frontend }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: ow-prepare-release
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.eu

      - name: Register task definitions for exact image digests
        id: register
        run: |
          set -euo pipefail
          BACKEND_DIGEST=$(aws ecr batch-get-image \
            --repository-name "${BACKEND_REPO}" --image-ids imageTag=latest \
            --query 'images[0].imageId.imageDigest' --output text)
          FRONTEND_DIGEST=$(aws ecr batch-get-image \
            --repository-name "${FRONTEND_REPO}" --image-ids imageTag=latest \
            --query 'images[0].imageId.imageDigest' --output text)
          for digest in "${BACKEND_DIGEST}" "${FRONTEND_DIGEST}"; do
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Invalid ECR image digest: ${digest}"
              exit 1
            }
          done

          for family in ow-migrator ow-backend ow-celery-worker ow-celery-beat ow-frontend; do
            image="${ECR_REGISTRY}/${BACKEND_REPO}@${BACKEND_DIGEST}"
            if [[ "${family}" == "ow-frontend" ]]; then
              image="${ECR_REGISTRY}/${FRONTEND_REPO}@${FRONTEND_DIGEST}"
            fi
            task_definition=$(aws ecs describe-task-definition \
              --task-definition "${family}" --query taskDefinition | jq --arg image "${image}" '
                .containerDefinitions[0].image = $image |
                del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                    .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
              ')
            task_definition_arn=$(aws ecs register-task-definition \
              --cli-input-json "${task_definition}" \
              --query taskDefinition.taskDefinitionArn --output text)
            output_name=${family//-/_}
            echo "${output_name}=${task_definition_arn}" >> "${GITHUB_OUTPUT}"
            echo "Registered ${task_definition_arn} with ${image}"
          done

  migrate:
    needs: prepare-release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: ow-migrate
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.eu

      - name: Run ow-migrator task
        id: run
        env:
          MIGRATOR_TASK_DEFINITION: ${{ needs.prepare-release.outputs.migrator_task_definition }}
        run: |
          set -e
          NET_CFG=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services ow-backend \
            --query 'services[0].networkConfiguration' --output json)
          CAPACITY_PROVIDER_STRATEGY=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services ow-backend \
            --query 'services[0].capacityProviderStrategy' --output json)
          if [[ "${CAPACITY_PROVIDER_STRATEGY}" == "[]" ]]; then
            echo "::error::ow-backend has no capacity-provider strategy"
            exit 1
          fi
          TASK_ARN=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${MIGRATOR_TASK_DEFINITION}" \
            --capacity-provider-strategy "${CAPACITY_PROVIDER_STRATEGY}" \
            --network-configuration "${NET_CFG}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Started migrator task: ${TASK_ARN}"
          echo "task_arn=${TASK_ARN}" >> "${GITHUB_OUTPUT}"
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}"

      - name: Verify migration succeeded
        env:
          TASK_ARN: ${{ steps.run.outputs.task_arn }}
        run: |
          set -e
          STOP_CODE=$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          STOP_REASON=$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "Migrator exit code: ${STOP_CODE}"
          echo "Stopped reason: ${STOP_REASON}"
          if [ "${STOP_CODE}" != "0" ]; then
            echo "::error::Migration failed (exit ${STOP_CODE}: ${STOP_REASON})"
            aws logs tail /ecs/ow-migrator --since 5m --region "${AWS_REGION}" || true
            exit 1
          fi

  deploy-frontend:
    needs: [prepare-release, migrate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: ow-deploy-frontend
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.eu

      - name: Force new deployment (ow-frontend)
        env:
          TASK_DEFINITION: ${{ needs.prepare-release.outputs.frontend_task_definition }}
        run: |
          aws ecs update-service --cluster "${ECS_CLUSTER}" \
            --service ow-frontend --task-definition "${TASK_DEFINITION}" \
            --query 'service.serviceName' --output text

      - name: Wait + confirm frontend rollout
        run: |
          set -e
          DEADLINE=$(( $(date +%s) + 1800 ))
          while true; do
            R=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services ow-frontend \
              --query 'services[0].deployments[0].rolloutState' --output text)
            echo "[ow-frontend] rolloutState=$R"
            case "$R" in COMPLETED|FAILED) break ;; esac
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "::error::ow-frontend rollout did not reach terminal state within 30 min"
              exit 1
            fi
            sleep 20
          done
          if [ "$R" != "COMPLETED" ]; then
            echo "::error::ow-frontend deployment failed"
            aws logs tail /ecs/ow-frontend --since 5m --region "${AWS_REGION}" || true
            exit 1
          fi

  deploy-svix:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: ow-deploy-svix
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.eu

      - name: Force new deployment (ow-svix-server)
        run: |
          aws ecs update-service --cluster "${ECS_CLUSTER}" \
            --service ow-svix-server --force-new-deployment \
            --query 'service.{rollout:deployments[0].rolloutState}' --output table

      - name: Wait + confirm svix rollout
        run: |
          set -e
          DEADLINE=$(( $(date +%s) + 1800 ))
          while true; do
            R=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services ow-svix-server \
              --query 'services[0].deployments[0].rolloutState' --output text)
            echo "[ow-svix-server] rolloutState=$R"
            case "$R" in COMPLETED|FAILED) break ;; esac
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "::error::ow-svix-server rollout did not reach terminal state within 30 min"
              exit 1
            fi
            sleep 20
          done
          if [ "$R" != "COMPLETED" ]; then
            echo "::error::ow-svix-server deployment failed"
            aws logs tail /ecs/ow-svix-server --since 5m --region "${AWS_REGION}" || true
            exit 1
          fi

  deploy-app:
    needs: [prepare-release, deploy-svix]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: ow-deploy-app
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.eu

      - name: Force new deployment on 3 services
        env:
          BACKEND_TASK_DEFINITION: ${{ needs.prepare-release.outputs.backend_task_definition }}
          WORKER_TASK_DEFINITION: ${{ needs.prepare-release.outputs.worker_task_definition }}
          BEAT_TASK_DEFINITION: ${{ needs.prepare-release.outputs.beat_task_definition }}
        run: |
          for deployment in \
            "ow-backend:${BACKEND_TASK_DEFINITION}" \
            "ow-celery-worker:${WORKER_TASK_DEFINITION}" \
            "ow-celery-beat:${BEAT_TASK_DEFINITION}"; do
            svc=${deployment%%:*}
            task_definition=${deployment#*:}
            aws ecs update-service --cluster "${ECS_CLUSTER}" \
              --service "${svc}" --task-definition "${task_definition}" \
              --query 'service.serviceName' --output text
          done

      - name: Wait for all 3 rollouts
        run: |
          set -e
          DEADLINE=$(( $(date +%s) + 1800 ))
          for svc in ow-backend ow-celery-worker ow-celery-beat; do
            echo "Polling $svc..."
            while true; do
              R=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "$svc" \
                --query 'services[0].deployments[0].rolloutState' --output text)
              echo "  [$svc] rolloutState=$R"
              case "$R" in COMPLETED|FAILED) break ;; esac
              if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
                echo "::error::[$svc] rollout did not reach terminal state within 30 min"
                exit 1
              fi
              sleep 20
            done
          done

      - name: Confirm all 3 outcomes
        run: |
          set -e
          FAILED=0
          for svc in ow-backend ow-celery-worker ow-celery-beat; do
            R=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "$svc" \
              --query 'services[0].deployments[0].rolloutState' --output text)
            REASON=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "$svc" \
              --query 'services[0].deployments[0].rolloutStateReason' --output text)
            echo "[$svc] rollout=$R reason=$REASON"
            if [ "$R" != "COMPLETED" ]; then
              echo "::error::[$svc] deployment failed: $REASON"
              aws logs tail "/ecs/$svc" --since 5m --region "${AWS_REGION}" || true
              FAILED=1
            fi
          done
          exit "${FAILED}"

      - name: Deployment summary
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## OW Production Deployment Complete"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Cluster | \`${ECS_CLUSTER}\` |"
            echo "| Services rolled | ow-frontend, ow-svix-server, ow-backend, ow-celery-worker, ow-celery-beat |"
            echo "| Image tag | \`latest\` + \`sha-${COMMIT_SHA:0:7}\` |"
            echo "| Commit | \`${COMMIT_SHA}\` |"
            echo "| URL | https://ow.getlucie.ai |"
          } >> "${GITHUB_STEP_SUMMARY}"

  configure-lucie-webhook:
    needs: deploy-app
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: ow-configure-lucie-webhook
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.eu

      - name: Restrict Lucie webhook subscriptions
        id: run
        env:
          SVIX_JWT_SECRET: ${{ secrets.SVIX_JWT_SECRET }}
        run: |
          set -euo pipefail
          NET_CFG=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services ow-backend \
            --query 'services[0].networkConfiguration' --output json)
          CAPACITY_PROVIDER_STRATEGY=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services ow-backend \
            --query 'services[0].capacityProviderStrategy' --output json)
          if [[ "${CAPACITY_PROVIDER_STRATEGY}" == "[]" ]]; then
            echo "::error::ow-backend has no capacity-provider strategy"
            exit 1
          fi
          BACKEND_TASK_DEF=$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services ow-backend \
            --query 'services[0].taskDefinition' --output text)
          SVIX_SERVER_URL=$(aws ecs describe-task-definition \
            --task-definition "${BACKEND_TASK_DEF}" \
            --query "taskDefinition.containerDefinitions[0].environment[?name=='SVIX_SERVER_URL'].value | [0]" \
            --output text)
          if [[ -z "${SVIX_SERVER_URL}" || "${SVIX_SERVER_URL}" == "None" ]]; then
            echo "::error::SVIX_SERVER_URL is not configured on the production backend task"
            exit 1
          fi
          TASK_DEF=ow-migrator
          CONTAINER_NAME=$(aws ecs describe-task-definition \
            --task-definition "${TASK_DEF}" \
            --query 'taskDefinition.containerDefinitions[0].name' --output text)
          OVERRIDES=$(jq -cn \
            --arg name "${CONTAINER_NAME}" \
            --arg svix_jwt_secret "${SVIX_JWT_SECRET}" \
            --arg svix_server_url "${SVIX_SERVER_URL}" \
            '{containerOverrides:[{
              name:$name,
              command:["uv","run","python","scripts/configure_lucie_webhook.py"],
              environment:[
                {name:"OUTGOING_WEBHOOKS_ENABLED",value:"true"},
                {name:"SVIX_SERVER_URL",value:$svix_server_url},
                {name:"SVIX_JWT_SECRET",value:$svix_jwt_secret}
              ]
            }]}')
          TASK_ARN=$(aws ecs run-task \
            --cluster "${ECS_CLUSTER}" \
            --task-definition "${TASK_DEF}" \
            --capacity-provider-strategy "${CAPACITY_PROVIDER_STRATEGY}" \
            --network-configuration "${NET_CFG}" \
            --overrides "${OVERRIDES}" \
            --query 'tasks[0].taskArn' --output text)
          if [[ -z "${TASK_ARN}" || "${TASK_ARN}" == "None" ]]; then
            echo "::error::Failed to start Lucie webhook configuration task"
            exit 1
          fi
          echo "Started webhook configuration task: ${TASK_ARN}"
          echo "task_arn=${TASK_ARN}" >> "${GITHUB_OUTPUT}"
          aws ecs wait tasks-stopped --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}"

      - name: Verify Lucie webhook configuration
        env:
          TASK_ARN: ${{ steps.run.outputs.task_arn }}
        run: |
          set -euo pipefail
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          STOP_REASON=$(aws ecs describe-tasks \
            --cluster "${ECS_CLUSTER}" --tasks "${TASK_ARN}" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "Webhook configuration exit code: ${EXIT_CODE}"
          echo "Stopped reason: ${STOP_REASON}"
          if [[ "${EXIT_CODE}" != "0" ]]; then
            echo "::error::Lucie webhook configuration failed (exit ${EXIT_CODE}: ${STOP_REASON})"
            aws logs tail /ecs/ow-migrator --since 5m --region "${AWS_REGION}" || true
            exit 1
          fi
