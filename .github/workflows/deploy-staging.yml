name: Deploy to staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 031244176128.dkr.ecr.us-east-1.amazonaws.com
  BACKEND_REPO: rhiseai/open-wearables-backend
  FRONTEND_REPO: rhiseai/open-wearables-frontend
  ROLE_ARN: arn:aws:iam::031244176128:role/github-actions-ow-publish

jobs:
  # ===========================================================================
  # Resolve EC2 public DNS (needed as VITE_API_URL at frontend build time)
  # ===========================================================================
  resolve-host:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      instance_id: ${{ steps.inst.outputs.instance_id }}
      public_dns: ${{ steps.inst.outputs.public_dns }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve staging instance id + public DNS
        id: inst
        run: |
          INSTANCE=$(aws ec2 describe-instances \
            --filters "Name=tag:app,Values=open-wearables" \
                      "Name=tag:environment,Values=staging" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].[InstanceId,PublicDnsName]' --output text)
          ID=$(echo "$INSTANCE" | awk '{print $1}')
          DNS=$(echo "$INSTANCE" | awk '{print $2}')
          if [[ "$ID" == "None" || -z "$ID" ]]; then
            echo "No running ow-staging instance found"; exit 1
          fi
          if [[ -z "$DNS" || "$DNS" == "None" ]]; then
            echo "Instance $ID has no public DNS — check that it has a public IP"; exit 1
          fi
          echo "instance_id=$ID" >> "$GITHUB_OUTPUT"
          echo "public_dns=$DNS" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Build + push backend and frontend images to ECR
  # ===========================================================================
  build:
    needs: resolve-host
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      backend_image: ${{ steps.tags.outputs.backend_image }}
      frontend_image: ${{ steps.tags.outputs.frontend_image }}
      sha_short: ${{ steps.tags.outputs.sha_short }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: ./backend
            repo: rhiseai/open-wearables-backend
          - name: frontend
            context: ./frontend
            repo: rhiseai/open-wearables-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute tags
        id: tags
        env:
          SHA: ${{ github.sha }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          SHORT="${SHA:0:7}"
          echo "sha_short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "backend_image=${REGISTRY}/${BACKEND_REPO}:staging" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY}/${FRONTEND_REPO}:staging" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build + push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            VITE_API_URL=https://ow-staging.getlucie.ai
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.repo }}:staging
            ${{ steps.ecr.outputs.registry }}/${{ matrix.repo }}:sha-${{ steps.tags.outputs.sha_short }}

  # Mirror the exact staging manifests across the partition boundary. Builds
  # happen once in Commercial AWS; both staging hosts deploy identical bytes.
  mirror-eusc:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    env:
      TARGET_REGION: eusc-de-east-1
      TARGET_ROLE_ARN: arn:aws-eusc:iam::326876515198:role/ow-deploy-staging
    steps:
      - name: Configure Commercial source credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: ow-staging-eusc-source-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Resolve exact staging digests
        id: source
        run: |
          set -euo pipefail
          for image in backend frontend; do
            repo_var="${image^^}_REPO"
            repo="${!repo_var}"
            digest=$(aws ecr batch-get-image --repository-name "$repo" \
              --image-ids imageTag=staging \
              --query 'images[0].imageId.imageDigest' --output text)
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::Invalid ${repo}:staging digest: ${digest}"
              exit 1
            }
            echo "${image}_digest=${digest}" >> "$GITHUB_OUTPUT"
          done

      - name: Login to Commercial ECR
        id: source-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Configure EU Sovereign target credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.TARGET_ROLE_ARN }}
          role-session-name: ow-staging-eusc-target-${{ github.run_id }}
          aws-region: ${{ env.TARGET_REGION }}
          audience: sts.amazonaws.eu

      - name: Login to EU Sovereign ECR
        id: target-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Copy exact staging images
        env:
          SOURCE_REGISTRY: ${{ steps.source-ecr.outputs.registry }}
          TARGET_REGISTRY: ${{ steps.target-ecr.outputs.registry }}
          BACKEND_DIGEST: ${{ steps.source.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.source.outputs.frontend_digest }}
          SHA_SHORT: ${{ needs.build.outputs.sha_short }}
        run: |
          set -euo pipefail
          for image in backend frontend; do
            repo_var="${image^^}_REPO"
            digest_var="${image^^}_DIGEST"
            repo="${!repo_var}"
            digest="${!digest_var}"
            source_image="${SOURCE_REGISTRY}/${repo}@${digest}"
            for tag in staging "sha-${SHA_SHORT}"; do
              docker buildx imagetools create --prefer-index=false \
                --tag "${TARGET_REGISTRY}/${repo}:${tag}" "$source_image"
            done
            copied=$(docker buildx imagetools inspect \
              "${TARGET_REGISTRY}/${repo}:staging" \
              --format '{{json .Manifest}}' | jq -r '.digest // empty')
            [[ "$copied" == "$digest" ]] || {
              echo "::error::${repo} EU digest ${copied} differs from ${digest}"
              exit 1
            }
          done

  # ===========================================================================
  # Deploy the same release to Commercial and EU through SSM. Commercial stays
  # active as the rollback target until the DNS cutover is proven healthy.
  # ===========================================================================
  deploy:
    needs: [build, mirror-eusc]
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: commercial
            region: us-east-1
            role_arn: arn:aws:iam::031244176128:role/github-actions-ow-publish
            registry: 031244176128.dkr.ecr.us-east-1.amazonaws.com
            sns_topic_arn: arn:aws:sns:us-east-1:031244176128:owear-staging
            audience: sts.amazonaws.com
          - name: eusc
            region: eusc-de-east-1
            role_arn: arn:aws-eusc:iam::326876515198:role/ow-deploy-staging
            registry: 326876515198.dkr.ecr.eusc-de-east-1.amazonaws.eu
            sns_topic_arn: arn:aws-eusc:sns:eusc-de-east-1:326876515198:owear-staging
            audience: sts.amazonaws.eu

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ matrix.target.role_arn }}
          role-session-name: ow-staging-${{ matrix.target.name }}-${{ github.run_id }}
          aws-region: ${{ matrix.target.region }}
          audience: ${{ matrix.target.audience }}

      - name: Resolve ${{ matrix.target.name }} staging host
        id: inst
        run: |
          INSTANCE=$(aws ec2 describe-instances \
            --filters "Name=tag:app,Values=open-wearables" \
                      "Name=tag:environment,Values=staging" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].[InstanceId,PublicDnsName]' --output text)
          ID=$(echo "$INSTANCE" | awk '{print $1}')
          DNS=$(echo "$INSTANCE" | awk '{print $2}')
          if [[ "$ID" == "None" || -z "$ID" || -z "$DNS" || "$DNS" == "None" ]]; then
            echo "No usable ${{ matrix.target.name }} OW staging host found"
            exit 1
          fi
          echo "instance_id=$ID" >> "$GITHUB_OUTPUT"
          echo "public_dns=$DNS" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM agent
        env:
          INSTANCE_ID: ${{ steps.inst.outputs.instance_id }}
        run: |
          for i in $(seq 1 30); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            if [[ "$STATUS" == "Online" ]]; then echo "SSM online"; exit 0; fi
            echo "  SSM status: $STATUS (retry $i)"; sleep 5
          done
          echo "SSM never came online"; exit 1

      - name: Generate .env from secrets
        id: env_gen
        env:
          OW_DB_PASSWORD: ${{ secrets.OW_DB_PASSWORD }}
          OW_PUBLIC_HOST: ${{ steps.inst.outputs.public_dns }}
          BACKEND_IMAGE: ${{ matrix.target.registry }}/${{ env.BACKEND_REPO }}:staging
          FRONTEND_IMAGE: ${{ matrix.target.registry }}/${{ env.FRONTEND_REPO }}:staging
        run: |
          # URL-encode the password for the svix DSN (svix parses a full
          # postgres:// URL, so any /, +, @, = in a base64-style secret
          # would break InvalidPort/InvalidHost parsing). Backend
          # connects via discrete DB_PASSWORD env and doesn't need this.
          OW_DB_PASSWORD_ENCODED=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["OW_DB_PASSWORD"],safe=""))')

          cat > .env.deploy <<EOF
          ENVIRONMENT=staging
          OW_PUBLIC_HOST=${OW_PUBLIC_HOST}
          OW_DOMAIN=ow-staging.getlucie.ai
          SERVER_EMAIL=admin@getlucie.ai
          OW_DB_NAME=open-wearables
          OW_DB_USER=open-wearables
          OW_DB_PASSWORD=${OW_DB_PASSWORD}
          OW_DB_PASSWORD_ENCODED=${OW_DB_PASSWORD_ENCODED}
          OW_IMAGE_BACKEND=${BACKEND_IMAGE}
          OW_IMAGE_FRONTEND=${FRONTEND_IMAGE}
          EOF
          echo "env_b64=$(base64 -w0 .env.deploy)" >> "$GITHUB_OUTPUT"

      - name: Generate ow.env (backend provider secrets)
        id: ow_env_gen
        env:
          OW_SECRET_KEY: ${{ secrets.OW_SECRET_KEY }}
          OW_ADMIN_EMAIL: ${{ secrets.OW_ADMIN_EMAIL }}
          OW_ADMIN_PASSWORD: ${{ secrets.OW_ADMIN_PASSWORD }}
          OPEN_WEARABLES_API_KEY: ${{ secrets.OPEN_WEARABLES_API_KEY }}
          OW_PUBLIC_HOST: ${{ steps.inst.outputs.public_dns }}
          TARGET_AWS_REGION: ${{ matrix.target.region }}
          TARGET_SNS_TOPIC_ARN: ${{ matrix.target.sns_topic_arn }}
          # Providers
          GARMIN_CLIENT_ID: ${{ secrets.GARMIN_CLIENT_ID }}
          GARMIN_CLIENT_SECRET: ${{ secrets.GARMIN_CLIENT_SECRET }}
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
          OURA_WEBHOOK_VERIFICATION_TOKEN: ${{ secrets.OURA_WEBHOOK_VERIFICATION_TOKEN }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          SUUNTO_CLIENT_ID: ${{ secrets.SUUNTO_CLIENT_ID }}
          SUUNTO_CLIENT_SECRET: ${{ secrets.SUUNTO_CLIENT_SECRET }}
          POLAR_CLIENT_ID: ${{ secrets.POLAR_CLIENT_ID }}
          POLAR_CLIENT_SECRET: ${{ secrets.POLAR_CLIENT_SECRET }}
          # Optional

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SVIX_JWT_SECRET: ${{ secrets.SVIX_JWT_SECRET }}
        run: |
          cat > ow.env.deploy <<EOF
          # Core
          SECRET_KEY=${OW_SECRET_KEY}
          SVIX_JWT_SECRET=${SVIX_JWT_SECRET}
          OUTGOING_WEBHOOKS_ENABLED=true
          ADMIN_EMAIL=${OW_ADMIN_EMAIL}
          ADMIN_PASSWORD=${OW_ADMIN_PASSWORD}
          OPEN_WEARABLES_API_KEY=${OPEN_WEARABLES_API_KEY}
          # Single-domain path routing. Traefik terminates TLS via Let's
          # Encrypt at ``ow-staging.getlucie.ai``; ``/api/*`` is stripped
          # and forwarded to ow-api, ``/*`` serves the dashboard.
          # Whoop/Oura receive redirect_uri rooted at ``/api`` below.
          API_BASE_URL=https://ow-staging.getlucie.ai
          SERVER_HOST=https://ow-staging.getlucie.ai
          FRONTEND_URL=https://ow-staging.getlucie.ai
          CORS_ORIGINS=["https://ow-staging.getlucie.ai"]

          # Email
          RESEND_API_KEY=${RESEND_API_KEY}
          EMAIL_FROM_ADDRESS=noreply@getlucie.ai
          EMAIL_FROM_NAME=Open Wearables

          # Sentry (hardcoded disabled on staging)
          SENTRY_ENABLED=False
          SENTRY_DSN=${SENTRY_DSN}
          SENTRY_ENV=staging

          # AWS (staging) — EC2 instance role handles auth, no access keys
          AWS_REGION=${TARGET_AWS_REGION}
          AWS_BUCKET_NAME=getlucie-ow-xml-staging
          AWS_SNS_TOPIC_ARN=${TARGET_SNS_TOPIC_ARN}

          # Garmin
          GARMIN_CLIENT_ID=${GARMIN_CLIENT_ID}
          GARMIN_CLIENT_SECRET=${GARMIN_CLIENT_SECRET}

          # Oura
          OURA_CLIENT_ID=${OURA_CLIENT_ID}
          OURA_CLIENT_SECRET=${OURA_CLIENT_SECRET}
          OURA_DEFAULT_SCOPE=personal daily activity heartrate workout session spo2 ring_configuration heart_health
          OURA_WEBHOOK_VERIFICATION_TOKEN=${OURA_WEBHOOK_VERIFICATION_TOKEN}

          # Whoop
          WHOOP_CLIENT_ID=${WHOOP_CLIENT_ID}
          WHOOP_CLIENT_SECRET=${WHOOP_CLIENT_SECRET}
          WHOOP_DEFAULT_SCOPE=offline read:cycles read:sleep read:recovery read:workout read:body_measurement read:profile

          # Suunto
          SUUNTO_CLIENT_ID=${SUUNTO_CLIENT_ID}
          SUUNTO_CLIENT_SECRET=${SUUNTO_CLIENT_SECRET}

          # Polar
          POLAR_CLIENT_ID=${POLAR_CLIENT_ID}
          POLAR_CLIENT_SECRET=${POLAR_CLIENT_SECRET}

          # Sync
          SYNC_INTERVAL_SECONDS=3600
          EOF
          echo "ow_env_b64=$(base64 -w0 ow.env.deploy)" >> "$GITHUB_OUTPUT"

      - name: Upload deploy tree + env to /app via SSM
        env:
          INSTANCE_ID: ${{ steps.inst.outputs.instance_id }}
          ENV_B64: ${{ steps.env_gen.outputs.env_b64 }}
          OW_ENV_B64: ${{ steps.ow_env_gen.outputs.ow_env_b64 }}
        run: |
          TAR_B64=$(tar -C . -czf - deploy | base64 -w0)

          # Build the full remote script, base64-encode it, then send a single
          # short SSM command that decodes and runs it. This avoids every
          # quoting pitfall with `--parameters commands=...` shorthand (which
          # breaks on single quotes, commas, and brackets in payloads).
          REMOTE_SCRIPT=$(cat <<REMOTE_EOF
          set -e
          mkdir -p /app
          echo "$TAR_B64" | base64 -d | tar -xzf - -C /app
          echo "$ENV_B64" | base64 -d > /app/.env
          echo "$OW_ENV_B64" | base64 -d > /app/ow.env
          chmod +x /app/deploy/scripts/*.sh
          REMOTE_EOF
          )
          SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)

          # Use jq to build a clean JSON params file — dodges shorthand parser.
          jq -n --arg s "$SCRIPT_B64" \
            '{commands: ["echo \($s) | base64 -d | bash"]}' \
            > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "OW staging: sync deploy tree + env" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "upload CommandId: $CMD_ID"
          if ! aws ssm wait command-executed --instance-id "$INSTANCE_ID" --command-id "$CMD_ID"; then
            aws ssm get-command-invocation --instance-id "$INSTANCE_ID" --command-id "$CMD_ID" \
              --query '{Status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' --output text
            exit 1
          fi

      - name: Run deploy.sh via SSM
        env:
          INSTANCE_ID: ${{ steps.inst.outputs.instance_id }}
        run: |
          jq -n '{commands: ["bash /app/deploy/scripts/deploy.sh"]}' > /tmp/ssm-run.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "OW staging: deploy" \
            --parameters file:///tmp/ssm-run.json \
            --cloud-watch-output-config 'CloudWatchOutputEnabled=true' \
            --query 'Command.CommandId' --output text)
          echo "deploy CommandId: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --instance-id "$INSTANCE_ID" --command-id "$CMD_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --instance-id "$INSTANCE_ID" \
            --command-id "$CMD_ID" \
            --query '{Status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' --output text

          if [[ "$STATUS" != "Success" ]]; then
            echo "::error::deploy.sh ended with Status=$STATUS"
            exit 1
          fi

      - name: Summary
        env:
          TARGET: ${{ matrix.target.name }}
          INSTANCE_ID: ${{ steps.inst.outputs.instance_id }}
          BACKEND_IMAGE: ${{ matrix.target.registry }}/${{ env.BACKEND_REPO }}:staging
          FRONTEND_IMAGE: ${{ matrix.target.registry }}/${{ env.FRONTEND_REPO }}:staging
          OW_PUBLIC_HOST: ${{ steps.inst.outputs.public_dns }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## OW staging deployment — $TARGET"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Instance | \`$INSTANCE_ID\` |"
            echo "| Backend | \`$BACKEND_IMAGE\` |"
            echo "| Frontend | \`$FRONTEND_IMAGE\` |"
            echo "| SHA | \`$COMMIT_SHA\` |"
            echo "| Dashboard | https://ow-staging.getlucie.ai |"
            echo "| API | https://ow-staging.getlucie.ai/api |"
            echo "| API Docs | https://ow-staging.getlucie.ai/api/docs |"
          } >> "$GITHUB_STEP_SUMMARY"
